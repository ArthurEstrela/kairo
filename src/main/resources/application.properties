spring.application.name=kairo

# --- POSTGRESQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/kairo_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIBERNATE ---
# Validate garante que as entidades JPA batem certo com o SQL real, mas não tenta alterar a BD
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- FLYWAY (Migrações) ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- REDIS (Para o futuro Leaderboard) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379