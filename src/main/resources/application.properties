spring.application.name=kairo

# --- POSTGRESQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/kairo_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIBERNATE ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- REDIS ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- JWT ---
# Em producao, define JWT_SECRET como variavel de ambiente (min. 32 caracteres)
jwt.secret=${JWT_SECRET:kairo-super-secret-key-para-desenvolvimento-local-2024}
jwt.expiration-ms=86400000

# --- OPENAI ---
# Em producao, define OPENAI_API_KEY como variavel de ambiente
openai.api.key=${OPENAI_API_KEY:sk-placeholder-configure-a-sua-chave}

# --- STRIPE ---
# Em producao, define STRIPE_WEBHOOK_SECRET como variavel de ambiente
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# --- VIRTUAL THREADS (Java 21) ---
spring.threads.virtual.enabled=true
