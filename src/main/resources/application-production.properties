# PRODUCAO: todas as seguintes env vars sao OBRIGATORIAS
# APP_CORS_ALLOWED_ORIGINS        — dominio(s) de producao (ex: https://kairo.com,https://www.kairo.com)
# APP_WEBSOCKET_ALLOWED_ORIGINS   — dominio(s) para WebSocket (ex: https://kairo.com)
# APP_FRONTEND_URL          — URL base do frontend (ex: https://kairo.com) — usado no returnUrl do Stripe
# JWT_SECRET                — minimo 32 chars, gerado aleatoriamente
# STRIPE_API_KEY            — sk_live_... (Stripe live mode)
# STRIPE_PRICE_ID_PREMIUM   — price_live_... do plano Premium no Stripe Dashboard
# STRIPE_WEBHOOK_SECRET     — whsec_... do endpoint webhook no Stripe Dashboard
# GEMINI_API_KEY            — chave de producao do Google AI Studio
